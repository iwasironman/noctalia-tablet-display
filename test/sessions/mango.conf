# Minimal mango session for testing the Tablet Display plugin.
# Test by logging out of your usual session and choosing this one in the
# greeter. Don't run it alongside another session on a second TTY: they share
# your user systemd, and mango stops graphical-session.target when it exits,
# which ends the other session too.
# Copy to ~/.config/mango/config.conf. Log out from Noctalia's session menu.

# Give the Sunshine service this session's display, not niri's.
exec_once=systemctl --user unset-environment NIRI_SOCKET HYPRLAND_INSTANCE_SIGNATURE SWAYSOCK
exec_once=systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec_once=noctalia

# Noctalia animates its own surfaces.
layer_animations=0

bind=SUPER,Return,spawn,ghostty
bind=SUPER,space,spawn,noctalia msg panel-toggle launcher
bind=SUPER,s,spawn,noctalia msg panel-toggle control-center
